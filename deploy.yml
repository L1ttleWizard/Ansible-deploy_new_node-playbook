---
# ==============================================================================
# ЭТАП 1: Настройка EU нод (Remnanode, Bridge, Telemt)
# ==============================================================================
- name: Подготовка европейских нод
  hosts: eu_nodes
  become: yes
  tasks:
    # --- УСТАНОВКА HAPROXY ---
    - name: Устанавливаем HAProxy (Debian/Ubuntu)
      ansible.builtin.apt:
        name: haproxy
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Устанавливаем HAProxy (RedHat/AlmaLinux)
      ansible.builtin.dnf:
        name: haproxy
        state: present
      when: ansible_os_family == "RedHat"

    - name: Конфигурация HAProxy (Main vs EU)
      ansible.builtin.template:
        src: "{{ 'haproxy_main.cfg.j2' if is_main|default(false) else 'haproxy_eu.cfg.j2' }}"
        dest: /etc/haproxy/haproxy.cfg
      register: haproxy_conf

    - name: Жестко фиксируем переносы строк в конце для HAProxy
      ansible.builtin.shell: |
        sed -i -e :a -e '/^\n*$/{$d;N;};/\n$/ba' /etc/haproxy/haproxy.cfg
        echo "# EOF FIX" >> /etc/haproxy/haproxy.cfg
        echo "" >> /etc/haproxy/haproxy.cfg
        echo "" >> /etc/haproxy/haproxy.cfg
      register: haproxy_conf

    - name: Перезапуск HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: restarted
      when: haproxy_conf.changed

    # ==========================================
    # НАСТРОЙКА ФАЕРВОЛА (КРОСС-ПЛАТФОРМЕННО)
    # ==========================================
    
    # --- БЛОК ДЛЯ DEBIAN/UBUNTU (UFW) ---
    - name: Настройка UFW для Debian
      block:
        - name: Устанавливаем UFW
          ansible.builtin.apt:
            name: ufw
            state: present
            
        - name: Разрешаем SSH и HTTPS (порты 22, 443)
          community.general.ufw:
            rule: allow
            port: "{{ item }}"
            proto: tcp
          loop: ['22', '443']
          
        - name: Разрешаем HTTP (порт 80) ТОЛЬКО для главной ноды
          community.general.ufw:
            rule: allow
            port: '80'
            proto: tcp
          when: is_main | default(false)

        - name: Разрешаем 8443 ТОЛЬКО для главной ноды
          community.general.ufw:
            rule: allow
            port: '8443'
            proto: tcp
          when: is_main | default(false)
          
        - name: Включаем фаервол UFW
          community.general.ufw:
            state: enabled
            policy: deny
            direction: incoming
      when: ansible_os_family == "Debian"

    # --- БЛОК ДЛЯ ALMALINUX/CENTOS (FIREWALLD) ---
    - name: Настройка Firewalld для AlmaLinux
      block:
        - name: Устанавливаем firewalld
          ansible.builtin.dnf:
            name: firewalld
            state: present
            
        - name: Включаем службу firewalld
          ansible.builtin.systemd:
            name: firewalld
            state: started
            enabled: yes
            
        - name: Открываем базовые порты (SSH, HTTPS)
          ansible.builtin.shell: |
            firewall-cmd --permanent --add-port=22/tcp
            firewall-cmd --permanent --add-port=443/tcp
            
        - name: Открываем HTTP (порт 80) ТОЛЬКО для главной ноды
          ansible.builtin.shell: firewall-cmd --permanent --add-port=80/tcp
          when: is_main | default(false)


        - name: Открываем 8443 ТОЛЬКО для главной ноды
          ansible.builtin.shell: firewall-cmd --permanent --add-port=8443/tcp
          when: is_main | default(false)
            
        - name: Применяем новые правила фаервола
          ansible.builtin.shell: firewall-cmd --reload
      when: ansible_os_family == "RedHat"
        
    # --- ИНТЕГРАЦИЯ С REMNAWAVE API И ЗАПУСК НОДЫ ---
    - name: Получаем список нод из панели
      ansible.builtin.uri:
        url: "https://{{ remnawave_domain }}/api/nodes/"
        method: GET
        headers:
          Authorization: "Bearer {{ remnawave_api_token }}"
        return_content: yes
      register: nodes_list
      delegate_to: localhost
      become: false

    - name: Проверяем, существует ли уже нода с таким IP
      ansible.builtin.set_fact:
        existing_node: "{{ nodes_list.json.response | selectattr('address', 'equalto', ansible_host) | list | first | default(none) }}"

    - name: Создаем ноду через API (если ее еще нет)
      ansible.builtin.uri:
        url: "https://{{ remnawave_domain }}/api/nodes/"
        method: POST
        headers:
          Authorization: "Bearer {{ remnawave_api_token }}"
        body_format: json
        body:
          name: "{{ inventory_hostname }}"
          address: "{{ ansible_host }}"
          port: "{{ node_port }}"
          isTrafficTrackingActive: false
          countryCode: "{{ country_code | default('EU') }}"
          configProfile:
            activeConfigProfileUuid: "{{ remnawave_profile_uuid }}"
            activeInbounds: "{{ remnawave_inbounds }}"
        status_code: 201
        return_content: yes
      register: new_node_api
      delegate_to: localhost
      become: false
      when: not existing_node

    - name: Финализируем SECRET_KEY (для УЖЕ СУЩЕСТВУЮЩИХ нод)
      ansible.builtin.set_fact:
        final_node_secret: "{{ node_secret }}"
      when: existing_node

    - name: Финализируем SECRET_KEY (для НОВЫХ нод)
      ansible.builtin.set_fact:
        final_node_secret: "{{ new_node_api.json.secretKey }}"
      when: not existing_node

    - name: Сохраняем node_secret в inventory.ini (для НОВЫХ нод)
      # Без этого второй прогон playbook'a для ноды, добавленной через
      # scripts/add_node.sh, упадёт: existing_node будет true, а node_secret
      # в inventory отсутствует.
      ansible.builtin.lineinfile:
        path: "{{ inventory_file }}"
        regexp: "^{{ inventory_hostname }}\\s.*$"
        line: "{{ inventory_hostname }} ansible_host={{ ansible_host }} ansible_user={{ ansible_user }}{% if ansible_port is defined %} ansible_port={{ ansible_port }}{% endif %} bridge_sni={{ bridge_sni }} node_port={{ node_port }} country_code={{ country_code | default('EU') }} node_secret=\"{{ final_node_secret }}\""
      delegate_to: localhost
      become: false
      when: not existing_node

    - name: Создаем директорию для Remnanode
      ansible.builtin.file:
        path: /opt/remnanode
        state: directory
        mode: '0755'

    - name: Генерируем docker-compose для Remnanode
      ansible.builtin.template:
        src: templates/eu_remnanode_docker-compose.yml.j2
        dest: /opt/remnanode/docker-compose.yml
      register: remnanode_compose

    - name: Перезапускаем Remnanode при изменениях
      ansible.builtin.shell: docker compose down && docker compose up -d
      args:
        chdir: /opt/remnanode
      when: remnanode_compose.changed

    # --- НАСТРОЙКА XRAY МОСТА ---
    - name: Создаем директорию моста
      ansible.builtin.file:
        path: /opt/bridge
        state: directory
        mode: '0755'

    - name: Проверяем, сгенерированы ли ключи Xray
      ansible.builtin.stat:
        path: /opt/bridge/keys.env
      register: keys_file

    - name: Авто-генерация UUID и ключей X25519 (если нет)
      ansible.builtin.shell: |
        UUID=$(cat /proc/sys/kernel/random/uuid)
        KEYS=$(docker run --rm teddysun/xray x25519)
        PRIV=$(echo "$KEYS" | grep "Private key:" | awk '{print $3}')
        PUB=$(echo "$KEYS" | grep "Public key:" | awk '{print $3}')
        
        echo "UUID=$UUID" > /opt/bridge/keys.env
        echo "PRIV=$PRIV" >> /opt/bridge/keys.env
        echo "PUB=$PUB" >> /opt/bridge/keys.env
      when: not keys_file.stat.exists

    - name: Считываем ключи с сервера в память Ansible
      ansible.builtin.slurp:
        src: /opt/bridge/keys.env
      register: keys_raw

    - name: Сохраняем ключи как Facts
      ansible.builtin.set_fact:
        bridge_uuid: "{{ (keys_raw.content | b64decode | regex_search('UUID=(.*)', '\\1'))[0] }}"
        bridge_private_key: "{{ (keys_raw.content | b64decode | regex_search('PRIV=(.*)', '\\1'))[0] }}"
        bridge_public_key: "{{ (keys_raw.content | b64decode | regex_search('PUB=(.*)', '\\1'))[0] }}"

    - name: Генерируем config.json для bridge-receiver
      ansible.builtin.template:
        src: templates/eu_xray_config.json.j2
        dest: /opt/bridge/config.json
      register: eu_bridge_conf

    - name: Генерируем docker-compose.yml для bridge-receiver
      ansible.builtin.template:
        src: templates/eu_docker-compose.yml.j2
        dest: /opt/bridge/docker-compose.yml

    - name: Перезапускаем мост в Европе, если конфиг обновился
      ansible.builtin.shell: docker compose down && docker compose up -d
      args:
        chdir: /opt/bridge
      when: eu_bridge_conf.changed

    # --- НАСТРОЙКА TELEMT ---
    - name: Создаем директорию для Telemt
      ansible.builtin.file:
        path: /opt/telemt/data
        state: directory
        mode: '0755'

    - name: Генерируем telemt.toml
      ansible.builtin.template:
        src: templates/eu_telemt.toml.j2
        dest: /opt/telemt/telemt.toml
      register: telemt_conf

    - name: Генерируем docker-compose.yml для Telemt
      ansible.builtin.template:
        src: templates/eu_telemt_docker-compose.yml.j2
        dest: /opt/telemt/docker-compose.yml

    - name: Перезапускаем Telemt, если конфиг обновился
      ansible.builtin.shell: docker compose down && docker compose up -d
      args:
        chdir: /opt/telemt
      when: telemt_conf.changed

    - name: Перезапускаем контейнер remnawave
      ansible.builtin.shell: docker restart remnawave

# ==============================================================================
# ЭТАП 2: Настройка маршрутизатора Яндекса
# ==============================================================================
- name: Настройка маршрутизации на Yandex-ноде
  hosts: yandex
  become: yes
  tasks:
    - name: Создаем директорию для моста
      ansible.builtin.file:
        path: /opt/bridge
        state: directory
        mode: '0755'

    - name: Генерируем config.json для bridge-sender
      ansible.builtin.template:
        src: templates/yandex_xray_config.json.j2
        dest: /opt/bridge/config.json
      register: yandex_xray_config

    - name: Генерируем docker-compose.yml для bridge-sender
      ansible.builtin.template:
        src: templates/yandex_docker-compose.yml.j2
        dest: /opt/bridge/docker-compose.yml
      register: yandex_xray_compose

    - name: Добавляем динамические бекенды в Hiddify HAProxy
      ansible.builtin.blockinfile:
        path: /opt/hiddify-manager/haproxy/haproxy.cfg.j2
        marker: "# {mark} ANSIBLE MANAGED BLOCK: MATRIX AND EU BRIDGE"
        block: |
          backend tuwunel_backend
              mode http
              http-request set-header Host %[req.hdr(Host)]
              http-request set-header X-Forwarded-For %[src]
              http-request set-header X-Forwarded-Proto https
              server tuwunel_server 127.0.0.1:6167

          backend bk_eu_bridge_sender
              mode tcp
              balance source
              option tcp-check
              {% for host in groups['eu_nodes'] %}
              server bridge_node_{{ loop.index }} 127.0.0.1:{{ 4430 + loop.index }}
              {% endfor %}
      register: yandex_haproxy_config

    - name: Жестко фиксируем переносы строк в конце для HAProxy
      ansible.builtin.shell: |
        sed -i -e :a -e '/^\n*$/{$d;N;};/\n$/ba' /opt/hiddify-manager/haproxy/haproxy.cfg.j2
        echo "# EOF FIX" >> /opt/hiddify-manager/haproxy/haproxy.cfg.j2
        echo "" >> /opt/hiddify-manager/haproxy/haproxy.cfg.j2
        echo "" >> /opt/hiddify-manager/haproxy/haproxy.cfg.j2

    - name: Перезапускаем мост Xray на Яндексе
      ansible.builtin.shell: docker compose down && docker compose up -d
      args:
        chdir: /opt/bridge
      when: yandex_xray_config.changed or yandex_xray_compose.changed

    - name: Применяем конфиг Hiddify
      ansible.builtin.shell: echo "" | bash /opt/hiddify-manager/apply_configs.sh
      when: yandex_haproxy_config.changed