---
# ==============================================================================
# ЭТАП 1: Подготовка европейских нод (Remnanode, Bridge-receiver, Telemt, HAProxy)
# ==============================================================================
- name: Подготовка европейских нод
  hosts: eu_nodes
  become: true
  roles:
    - role: docker
      when: not (is_main | default(false) | bool)
    - role: firewall
      when: not (is_main | default(false) | bool)
    - role: haproxy
      when: not (is_main | default(false) | bool)
    - role: remnanode
    - role: telemt

# ==============================================================================
# ЭТАП 2: Настройка маршрутизатора Яндекса (bridge-sender + Hiddify HAProxy)
# ==============================================================================
- name: Настройка маршрутизации на Yandex-ноде
  hosts: yandex
  become: true
  roles:
    - role: yandex_bridge
