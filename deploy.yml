- name: Подготовка европейских нод
  hosts: eu_nodes
  become: yes
  tasks:
    - name: Инициализация папок
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop: [ "/opt/bridge", "/opt/remnanode", "/opt/telemt/data" ]

    - name: Проверка и генерация Reality ключей
      ansible.builtin.shell: |
        if [ ! -f /opt/bridge/keys.env ]; then
          UUID=$(cat /proc/sys/kernel/random/uuid)
          KEYS=$(docker run --rm teddysun/xray x25519)
          PRIV=$(echo "$KEYS" | grep "Private key:" | awk '{print $3}')
          PUB=$(echo "$KEYS" | grep "Public key:" | awk '{print $3}')
          echo "UUID=$UUID\nPRIV=$PRIV\nPUB=$PUB" > /opt/bridge/keys.env
        fi
      register: key_gen

    - name: Сбор ключей для Facts
      ansible.builtin.shell: cat /opt/bridge/keys.env
      register: keys_raw
      changed_when: false

    - name: Установка Facts
      ansible.builtin.set_fact:
        bridge_uuid: "{{ keys_raw.stdout | regex_search('UUID=(.*)', '\\1') | first }}"
        bridge_private_key: "{{ keys_raw.stdout | regex_search('PRIV=(.*)', '\\1') | first }}"
        bridge_public_key: "{{ keys_raw.stdout | regex_search('PUB=(.*)', '\\1') | first }}"
    # ... тут таски установки Docker, Xray и Remnanode как в оригинале ...

- name: Настройка Яндекса
  hosts: yandex
  become: yes
  tasks:
    - name: Обновление Xray Bridge-Sender
      ansible.builtin.template:
        src: templates/yandex_xray_config.json.j2
        dest: /opt/bridge/config.json
      register: y_xray

    - name: Инъекция в Hiddify HAProxy (HTTP)
      ansible.builtin.blockinfile:
        path: /opt/hiddify-manager/haproxy/fronts/in_httpmode.cfg.pj2
        insertbefore: "default_backend nginx_dispatcher_http_h2"
        marker: "  # {mark} ANSIBLE MANAGED BLOCK: MATRIX ROUTING"
        block: |
          acl is_matrix path_beg -i /_matrix /_synapse
          use_backend tuwunel_backend if is_matrix
      register: h_mod

    - name: Инъекция в SNI Proxy (Bridge)
      ansible.builtin.blockinfile:
        path: /opt/hiddify-manager/haproxy/fronts/sni_proxy.cfg.pj2
        insertbefore: "default_backend to_https_in_ssl"
        marker: "    # {mark} ANSIBLE MANAGED BLOCK: EU BRIDGE ROUTING"
        block: |
          {% for host in groups['eu_nodes'] %}
          acl is_bridge_{{ loop.index }} req.ssl_sni -i {{ hostvars[host]['bridge_sni'] }}
          use_backend bk_eu_bridge_sender if is_bridge_{{ loop.index }}
          {% endfor %}
      register: s_mod

    - name: Применение настроек Hiddify (с авто-нажатием Enter)
      ansible.builtin.shell:
        cmd: "yes '' | bash /opt/hiddify-manager/apply_configs.sh"
        executable: /bin/bash
      async: 300
      poll: 5
      # Проверяем изменения, безопасно обрабатывая отсутствие переменных
      when: >
        (h_mod.changed | default(false)) or  (s_mod.changed | default(false))
        or  (y_xray.changed | default(false)) or (y_xray_compose.changed |
        default(false))

    - name: Финальная проверка статуса моста
      ansible.builtin.shell: docker ps --filter name=bridge-sender
      register: bridge_status

    - name: Вывод статуса
      ansible.builtin.debug:
        msg: "Мост на Яндексе запущен и настроен!"
      when: bridge_status.stdout.find('Up') != -1
