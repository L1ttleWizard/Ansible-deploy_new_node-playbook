---
- name: Устанавливаем HAProxy (Debian/Ubuntu)
  ansible.builtin.apt:
    name: haproxy
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Устанавливаем HAProxy (RedHat/AlmaLinux)
  ansible.builtin.dnf:
    name: haproxy
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Конфигурация HAProxy
  ansible.builtin.template:
    src: haproxy_eu.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
  register: haproxy_conf
  notify: Restart HAProxy
